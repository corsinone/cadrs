[package]
name = "cadrs_host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `cadrs --host`: the always-online owner of a team's documents, with no window. It needs the
# document model and the network, not the app.
[dependencies]
bevy.workspace = true
cadrs_core.workspace = true
cadrs_fs.workspace = true
cadrs_net.workspace = true
ron.workspace = true
serde.workspace = true
uuid.workspace = true

# The admin page, served by axum on a runtime of its own (as cadrs_mcp does); a page never
# runs a host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum.workspace = true
form_urlencoded.workspace = true
tokio = { workspace = true, features = ["rt", "net"] }

[dev-dependencies]
uuid.workspace = true
